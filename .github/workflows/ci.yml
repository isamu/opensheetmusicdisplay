name: CI
# replaces .appveyor

on:
  [push, pull_request] # (all branches)
  #branches: [develop, master]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package.json') }}

      - name: Install Firefox (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask firefox

      - name: Install dependencies
        run: npm install

      # - name: Lint # included in npm install
      #   run: npm run lint

      # - name: Patch VexFlow # included in npm install, npm run build
      #   run: npm run prebuildVexflow

      # - name: Build
      #   run: npm run build # included in npm install

      - name: Test
        run: npm test
        env:
          CI: true
